<!doctype html>
<html lang="en" data-bs-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Admin Login - Student DBMS</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link href="{{ url_for('static', filename='css/styles.css') }}" rel="stylesheet" />
  </head>

  <body class="auth-body">
    <div class="container py-5">
      <div class="row justify-content-center">
        <div class="col-12 col-md-6">
          <div class="card card-glass p-4">
            <div class="d-flex align-items-center gap-3 mb-3">
              <div class="logo-circle">A</div>
              <div>
                <h3 class="m-0">Admin Login</h3>
                
              </div>
            </div>

            {% if error %}
              <div class="alert alert-danger">{{ error }}</div>
            {% endif %}

            <!-- Placeholder for the 3D/animated embed (keeps the page layout intact) -->
            <div class="mb-3 text-center">
              <div class="auth-card-anim" style="display:inline-block;">
                <span
                  class="badge"
                  style="background: rgba(124,92,255,0.18); border: 1px solid rgba(124,92,255,0.35); color: var(--text);"
                  >Admin Login</span
                >
              </div>
            </div>

            <form method="post" novalidate>
              <div class="mb-3">
                <label class="form-label">Username</label>
                <input
                  class="form-control"
                  name="username"
                  autocomplete="username"
                  required
                />
              </div>

              <div class="mb-3">
                <label class="form-label">Password</label>
                <input
                  class="form-control"
                  type="password"
                  name="password"
                  autocomplete="current-password"
                  required
                />
              </div>

              <button class="btn btn-primary w-100" type="submit">Login</button>


            </form>
          </div>
        </div>
      </div>
    </div>

    <style>
      /* simple float-in animation helper (used by the placeholder above) */
      @keyframes floatUp {
        from {
          opacity: 0;
          transform: translateY(18px) scale(0.98);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      .auth-card-anim {
        animation: floatUp 0.8s ease both;
      }
    </style>

    <script src="{{ url_for('static', filename='js/dark_mode.js') }}"></script>
  </body>
</html>
