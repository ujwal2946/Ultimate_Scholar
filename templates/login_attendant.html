<!doctype html>
<html lang="en" data-bs-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Attendant Login - Student DBMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="{{ url_for('static', filename='css/styles.css') }}" rel="stylesheet" />
  </head>
  <body class="auth-body">
    <div class="container py-5">
      <div class="row justify-content-center">
        <div class="col-12 col-md-6">
          <div class="card card-glass p-4">
            <div class="d-flex align-items-center gap-3 mb-3">
              <div class="logo-circle">T</div>
              <div>
                <h3 class="m-0">Attendant Login</h3>
                
              </div>
            </div>

            {% if error %}
              <div class="alert alert-danger">{{ error }}</div>
            {% endif %}

            <form method="post" novalidate>
              <div class="mb-3">
                <label class="form-label">Username</label>
                <input class="form-control" name="username" autocomplete="username" required />
              </div>
              <div class="mb-3">
                <label class="form-label">Password</label>
                <input class="form-control" type="password" name="password" autocomplete="current-password" required />
              </div>
              <button class="btn btn-primary w-100" type="submit">Login</button>
              <div class="text-center mt-3">
                <a class="text-muted" href="{{ url_for('bp_main.get_started') }}">Change Role</a>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>

    <script src="{{ url_for('static', filename='js/dark_mode.js') }}"></script>
  </body>
</html>
