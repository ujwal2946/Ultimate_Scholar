{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
  <div class="d-flex align-items-center justify-content-between mb-3">
    <div>
      <h2>Settings</h2>
      <div class="text-muted">Admin configuration and operational tools.</div>
    </div>
  </div>

  <div class="row g-3">
    <div class="col-md-6">
      <div class="card shadow-sm border-0">
        <div class="card-body">
          <h5 class="card-title">Change Password</h5>
          <form method="POST" action="{{ url_for('bp_settings_admin.change_password') }}" class="mt-3">
            <div class="mb-3">
              <label class="form-label">Current Password</label>
              <input type="password" name="current_password" class="form-control" required />
            </div>
            <div class="mb-3">
              <label class="form-label">New Password</label>
              <input type="password" name="new_password" class="form-control" required minlength="6" />
            </div>
            <button class="btn btn-primary">Update</button>
          </form>
        </div>
      </div>
    </div>

    <div class="col-md-6">
      <div class="card shadow-sm border-0">
        <div class="card-body">
          <h5 class="card-title">Backup / Restore / Logs</h5>
          <p class="text-muted mb-3">Coming in next iteration.</p>
          <button class="btn btn-outline-secondary" disabled>Coming soon</button>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
