{% extends 'base.html' %}
{% block content %}
<div class="page-grid">
  <div class="card card-glass">
    <div class="card-body">
      <h5 class="card-title mb-3">{{ 'Add Marks' if mode=='add' else 'Edit Marks' }}</h5>

      {% if message %}
        <div class="alert alert-warning">{{ message }}</div>
      {% endif %}

      <form method="post">
        <div class="row g-3">
          <div class="col-12 col-md-6">
            <label class="form-label">Student</label>
            <select class="form-select" name="student_id" required>
              <option value="">Select student</option>
              {% for s in students %}
                <option value="{{ s.id }}" {% if form.student_id and form.student_id==s.id %}selected{% endif %}>{{ s.full_name }} ({{ s.roll_number }})</option>
              {% endfor %}
            </select>
          </div>
          <div class="col-12 col-md-3">
            <label class="form-label">Subject</label>
            <input class="form-control" name="subject" placeholder="Math" value="{{ form.subject or '' }}" required />
          </div>
          <div class="col-12 col-md-3">
            <label class="form-label">Semester</label>
            <input class="form-control" name="semester" placeholder="Sem 1" value="{{ form.semester or '' }}" required />
          </div>

          <div class="col-12 col-md-4">
            <label class="form-label">Marks</label>
            <input class="form-control" type="number" name="marks" min="0" value="{{ form.marks if form.marks is not none else '' }}" required />
          </div>

          <div class="col-12">
            <button class="btn btn-primary" type="submit">Save</button>
            <a class="btn btn-glass ms-2" href="{{ url_for('bp_grades_admin.list_grades') }}">Back</a>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
