<!doctype html>
<html lang="en" data-bs-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Role Selection - Student DBMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="{{ url_for('static', filename='css/styles.css') }}" rel="stylesheet" />
  </head>
  <body class="roles-body">
    <div class="container py-5">
      <div class="text-center mb-4">
        <h2 class="fw-bold">Choose Your Role</h2>
        <p class="text-muted">Login to access your dashboard.</p>
      </div>

      <div class="row g-4 justify-content-center">
        <div class="col-12 col-md-4">
          <a class="role-card" href="{{ url_for('bp_auth_admin.login_admin') }}" aria-label="Admin login">
            <div class="role-card-inner">
              <div class="role-icon">
                <svg width="34" height="34" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path d="M12 12c2.21 0 4-1.79 4-4S14.21 4 12 4 8 5.79 8 8s1.79 4 4 4Z" stroke="currentColor" stroke-width="2"/>
                  <path d="M20 21a8 8 0 0 0-16 0" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
              </div>
              <div class="role-title">Admin</div>
              <div class="role-desc">Manage students and view system overview.</div>
            </div>
          </a>
        </div>

        <div class="col-12 col-md-4">
          <a class="role-card" href="{{ url_for('bp_auth_attendant.login_attendant') }}" aria-label="Attendant login">
            <div class="role-card-inner">
              <div class="role-icon">
                <svg width="34" height="34" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z" stroke="currentColor" stroke-width="2"/>
                </svg>
              </div>
              <div class="role-title">Attendant</div>
              <div class="role-desc">Mark attendance and handle student lists.</div>
            </div>
          </a>
        </div>

        <div class="col-12 col-md-4">
          <a class="role-card" href="{{ url_for('bp_auth_student.login_student') }}" aria-label="Student login">
            <div class="role-card-inner">
              <div class="role-icon">
                <svg width="34" height="34" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path d="M4 19.5V16a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                  <path d="M16 11a4 4 0 1 1-8 0" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                  <path d="M12 3v2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
              </div>
              <div class="role-title">Student</div>
              <div class="role-desc">View profile, attendance percent, grades, and notifications.</div>
            </div>
          </a>
        </div>
      </div>

      <div class="text-center mt-4">
        <a class="text-muted" href="{{ url_for('bp_main.welcome') }}">Back to Welcome</a>
      </div>
    </div>

    <script src="{{ url_for('static', filename='js/dark_mode.js') }}"></script>
  </body>
</html>
