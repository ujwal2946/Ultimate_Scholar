<!doctype html>
<html lang="en" data-bs-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Welcome - Ultimate_Scholar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="{{ url_for('static', filename='css/styles.css') }}" rel="stylesheet" />
  </head>
  <body class="welcome-body">
    <button
      id="darkModeToggle"
      type="button"
      class="btn btn-glass btn-sm position-fixed"
      style="top: 16px; right: 16px; z-index: 2000;"
      aria-label="Toggle theme"
      title="Toggle theme"
      aria-pressed="false"
    >
      <span class="theme-icon">🌙</span>
      <span class="theme-label ms-1">Dark</span>
    </button>

    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>

    <div class="welcome-card card-glass">
      <div class="welcome-icon">
        <div class="logo-circle">US</div>
      </div>
      <h2 class="fw-bold">Ultimate-Scholar</h2>
      <p class="text-muted mb-4">A clean Student Management System</p>

      <div class="d-flex gap-2 flex-wrap">
        <a class="btn btn-primary btn-lg" href="{{ url_for('bp_main.get_started') }}">Get Started</a>
        
      </div>

      <div class="mt-4 small text-muted"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/dark_mode.js') }}"></script>
  </body>
</html>
